[project]
name = "recruitment-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cj-data-eng", email = "cjbastiendata@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
]

[project.scripts]
recruitment-analytics = "recruitment_analytics:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dbt-athena>=1.11.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
